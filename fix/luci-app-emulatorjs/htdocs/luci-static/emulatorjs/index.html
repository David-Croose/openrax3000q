<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>EmulatorJS</title>
        <link rel = icon href = docs/favicon.ico sizes = "16x16 32x32 48x48 64x64" type = image/vnd.microsoft.icon>
        <meta name = viewport content = "width = device-width, initial-scale = 1">
        <style>
             body, html {
                height: 100%;
                color: white;
            }

            body {
                margin: 0;
                overflow: hidden;
            }

            /* Game mode: standalone full-screen page */
            body.game-mode, html.game-mode {
                background-color: #000;
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            body.game-mode #display,
            html.game-mode #display {
                position: fixed;
                top: 0; left: 0;
                width: 100vw !important;
                height: 100vh !important;
            }

            /* List mode: embedded in OpenWRT iframe */
            body.list-mode, html.list-mode {
                background-color: transparent;
            }

            body, #box, #top {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }

            #box {
                color: #aaa;
                height: 20em;
                width: 30em;
                max-width: 80%;
                max-height: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                text-align: center;
                padding: 10px;
            }

            #box:hover, #box[drag] {
                border-color: #38f;
                color: #ddd
            }

            #input {
                cursor: pointer;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
            }

            #display {
                width: 100%;
                height: 100%
            }

            select, button {
                padding: 0.6em 0.4em;
                margin: 0.5em;
                width: 15em;
                max-width: 100%;
                font-family: monospace;
                font-weight: bold;
                font-size: 16px;
                background-color: #444;
                color: #aaa;
                border-radius: 0.4em;
                border: 1px solid #555;
                cursor: pointer;
                transition-duration: 0.2s
            }

            select:hover, button:hover {
                background-color: #666;
                color: #ddd
            }

            .logo {
                width: 130px;
                height: 130px;
                filter: drop-shadow(0 0 10px white);
            }

            #top {
                margin: 5px;
            }

            .game-list-container {
                width: 100%;
                max-height: 55vh;
                overflow-y: auto;
                padding: 10px;
            }

            .game-category {
                margin-bottom: 20px;
            }

            .game-category-title {
                font-size: 18px;
                color: #38f;
                margin: 15px 0 10px 0;
                border-bottom: 1px solid #444;
                padding-bottom: 5px;
            }

            .game-subcategory-title {
                font-size: 16px;
                color: #aaa;
                margin: 10px 0 8px 20px;
            }

            .game-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-left: 20px;
            }

            .game-button {
                width: auto !important;
                min-width: 120px;
            }
        </style>
    </head>

    <body>
        <div id="top">
            <img src="docs/Logo-light.png" alt="Logo" class="logo">
            <br>
            <div id="game-list" class="game-list-container">
                <p>正在加载游戏列表...</p>
            </div>
            <br>
        </div>
        <div id="box">
            <input type = file id = input>
            Drag ROM file or click here
        </div>

        <script>
            let enableDebug = true;
            let enableThreads = false;
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);

            // Set mode class based on URL params
            if (urlParams.get('id') || urlParams.get('rom')) {
                document.documentElement.classList.add('game-mode');
                document.body.classList.add('game-mode');
            } else {
                document.documentElement.classList.add('list-mode');
                document.body.classList.add('list-mode');
            }
            if (parseInt(urlParams.get('debug')) === 1 || urlParams.get('debug') === "true") {
                enableDebug = true;
                console.log("Debug is enabled");
            } else {
                console.log("Debug is disabled");
            }

            if (parseInt(urlParams.get('threads')) === 1 || urlParams.get('threads') === "true") {
                if (window.SharedArrayBuffer) {
                    enableThreads = true;
                    console.log("Threads are enabled");
                } else {
                    console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
                    console.log("Threads are disabled");
                }
            } else {
                console.log("Threads are disabled");
            }

            if (urlParams.get('rom')) {
                console.log(`Loading ROM from URL: ${urlParams.get('rom')}`);
                run(false, urlParams.get('rom'));
            } else if (urlParams.get('id')) {
                // New page mode: load game by ID from CGI proxy
                loadGameById(urlParams.get('id'));
            } else {
                loadGameList();
            }

            // GBK decoder: Base64 string -> UTF-8 string
            // Uses native TextDecoder('gbk') available in modern browsers
            function gbkDecode(b64str) {
                try {
                    const latin1 = atob(b64str);  // Base64 → Latin1 (each char = 1 byte)
                    const bytes = new Uint8Array(latin1.length);
                    for (let i = 0; i < latin1.length; i++) bytes[i] = latin1.charCodeAt(i);
                    return new TextDecoder('gbk').decode(bytes);
                } catch (e) {
                    console.warn('GBK decode failed:', e);
                    return atob(b64str);  // fallback: raw Latin1
                }
            }

            async function loadGameById(gameId) {
                const gameCat = urlParams.get('cat') || '';
                const gameName = urlParams.get('name') || 'game';
                console.log(`Loading game: id=${gameId} cat=${gameCat} name=${gameName}`);
                window._ejs_gameName = gameName;
                window._ejs_cat = gameCat;
                try {
                    const response = await fetch(`/cgi-bin/emulatorjs_rom?id=${gameId}`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}: 无法下载ROM文件`);
                    const blob = await response.blob();
                    if (blob.size === 0) throw new Error('文件为空');
                    const blobUrl = URL.createObjectURL(blob);
                    run(false, blobUrl);
                } catch (err) {
                    document.body.innerHTML = `<div style="color:#fff;padding:20px;text-align:center;">游戏加载失败: ${err.message}<br><br><a href="index.html">返回游戏列表</a></div>`;
                    console.error(err);
                }
            }

            async function loadGameList() {
                try {
                    const response = await fetch('/cgi-bin/emulatorjs_list');
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const games = await response.json();
                    displayGameList(games);
                } catch (error) {
                    console.error('加载游戏列表失败:', error);
                    document.getElementById('game-list').innerHTML =
                        '<p style="color: red;">加载游戏列表失败</p><p>请检查 CGI 脚本 /cgi-bin/emulatorjs_list 是否已部署</p>';
                }
            }

            function displayGameList(games) {
                const container = document.getElementById('game-list');
                container.innerHTML = '';

                // Group by cat (extension = system type)
                const grouped = {};
                games.forEach(game => {
                    const cat = game.cat || 'unknown';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(game);
                });

                // Render
                Object.keys(grouped).sort().forEach(cat => {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'game-category';

                    const categoryTitle = document.createElement('div');
                    categoryTitle.className = 'game-category-title';
                    categoryTitle.textContent = getCatName(cat);
                    categoryDiv.appendChild(categoryTitle);

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'game-grid';

                    grouped[cat].forEach(game => {
                        const button = document.createElement('button');
                        button.className = 'game-button';
                        const displayName = game.name_b64 ? gbkDecode(game.name_b64) : (game.name || 'game');
                        button.textContent = displayName;
                        button.onclick = () => startGame(game.id, displayName, displayName, game.cat);
                        gridDiv.appendChild(button);
                    });

                    categoryDiv.appendChild(gridDiv);
                    container.appendChild(categoryDiv);
                });
            }

            function getCatName(cat) {
                const names = {
                    'nes': '任天堂娱乐系统 (NES)',
                    'snes': '超级任天堂 (SNES)',
                    'gb': 'Game Boy',
                    'gba': 'Game Boy Advance',
                    'n64': 'Nintendo 64',
                    'md': '世嘉 Genesis / Mega Drive (MD)'
                };
                return names[cat] || cat;
            }

            function startGame(gameId, gameName, gameFilename, gameCat) {
                window.open(`index.html?id=${gameId}&cat=${(gameCat || '').toLowerCase()}&name=${encodeURIComponent(gameName || 'game')}`, '_blank');
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : file;
                let filename;
                if (upload) {
                    filename = input.files[0].name;
                } else if (file.startsWith('blob:')) {
                    filename = window._ejs_gameName || 'game';
                } else {
                    const rawFilename = file.split('/').pop();
                    filename = decodeURIComponent(rawFilename);
                }
                const parts = filename.split(".");

                // Core type: prefer CAT from URL param, fallback to extension
                const extFromCat = window._ejs_cat || '';
                const extFromFile = parts.pop() || '';

                const core = await (async (ext) => {
                    if (!ext) { /* unknown - show picker */ } else
                    if (["fds", "nes", "unif", "unf"].includes(ext))
                        return "nes"
                    else
                    if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                        return "snes"
                    else
                    if (["z64", "n64"].includes(ext))
                        return "n64"
                    else
                    if (["md", "smd"].includes(ext))
                        return "segaMD"
                    else
                    if (["pce"].includes(ext))
                        return "pce"
                    else
                    if (["ngp", "ngc"].includes(ext))
                        return "ngp"
                    else
                    if (["ws", "wsc"].includes(ext))
                        return "ws"
                    else
                    if (["col", "cv"].includes(ext))
                        return "coleco"
                    else
                    if (["d64"].includes(ext))
                        return "vice_x64sc"
                    else
                    if (["nds", "gba", "gb"].includes(ext))
                        return ext

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Nintendo 64": "n64",
                            "Nintendo Game Boy": "gb",
                            "Nintendo Game Boy Advance": "gba",
                            "Nintendo DS": "nds",
                            "Nintendo Entertainment System": "nes",
                            "Super Nintendo Entertainment System": "snes",
                            "PlayStation": "psx",
                            "Virtual Boy": "vb",
                            "Sega Mega Drive": "segaMD",
                            "Sega Master System": "segaMS",
                            "Sega CD": "segaCD",
                            "Atari Lynx": "lynx",
                            "Sega 32X": "sega32x",
                            "Atari Jaguar": "jaguar",
                            "Sega Game Gear": "segaGG",
                            "Sega Saturn": "segaSaturn",
                            "Atari 7800": "atari7800",
                            "Atari 2600": "atari2600",
                            "Arcade": "arcade",
                            "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                            "NEC PC-FX": "pcfx",
                            "SNK NeoGeo Pocket (Color)": "ngp",
                            "Bandai WonderSwan (Color)": "ws",
                            "ColecoVision": "coleco",
                            "Commodore 64": "vice_x64sc",
                            "Commodore 128": "vice_x128",
                            "Commodore VIC20": "vice_xvic",
                            "Commodore Plus/4": "vice_xplus4",
                            "Commodore PET": "vice_xpet"
                        }

                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(extFromCat || extFromFile)

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                top.remove();
                box.remove()
                div.appendChild(sub)
                document.body.appendChild(div)

                // 添加加载状态提示
                const loadingDiv = document.createElement('div');
                loadingDiv.id = 'loading-status';
                loadingDiv.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 18px; z-index: 1000; text-align: center;';
                loadingDiv.innerHTML = '<div style="font-size: 40px; margin-bottom: 15px;">🎮</div><div>正在加载游戏...</div><div style="font-size: 14px; color: #888; margin-top: 10px;">请稍候，首次加载可能需要下载模拟器核心</div>';
                document.body.appendChild(loadingDiv);

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = "";
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_disableDatabases = true;
                window.EJS_threads = enableThreads;

                // 添加网络错误监听
                window.addEventListener('error', function(e) {
                    if (e.message && e.message.toLowerCase().includes('network')) {
                        console.error('检测到网络错误:', e);
                        const loadingStatus = document.getElementById('loading-status');
                        if (loadingStatus) {
                            loadingStatus.innerHTML = `<div style="color: #ff4444;">❌ 加载失败</div><div style="font-size: 14px; margin-top: 15px;">无法下载ROM文件，请检查：</div><ul style="text-align: left; display: inline-block; margin-top: 10px;"><li>文件路径是否正确</li><li>文件名是否包含特殊字符</li><li>服务器权限设置</li></ul><button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">返回游戏列表</button>`;
                        }
                    }
                }, true);

                script.src = "data/loader.js";
                script.onload = function() {
                    // 移除加载提示
                    const loadingStatus = document.getElementById('loading-status');
                    if (loadingStatus) {
                        loadingStatus.remove();
                    }
                };
                script.onerror = function() {
                    console.error('无法加载 EmulatorJS 核心文件');
                    const loadingStatus = document.getElementById('loading-status');
                    if (loadingStatus) {
                        loadingStatus.innerHTML = '<div style="color: #ff4444;">❌ 加载失败</div><div style="font-size: 14px; margin-top: 15px;">无法加载模拟器核心文件</div><button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; cursor: pointer;">返回游戏列表</button>';
                    }
                };
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
