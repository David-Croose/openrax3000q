<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>EmulatorJS</title>
        <link rel = icon href = docs/favicon.ico sizes = "16x16 32x32 48x48 64x64" type = image/vnd.microsoft.icon>
        <meta name = viewport content = "width = device-width, initial-scale = 1">
        <style>
             body, html {
                height: 100%;
                background-color: transparent;
                color: white;
            }

            body {
                margin: 0;
                overflow: hidden;
            }

            body, #box, #top {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }

            #box {
                color: #aaa;
                height: 20em;
                width: 30em;
                max-width: 80%;
                max-height: 80%;
                background-color: #333;
                border-radius: 0.4em;
                border: 2px solid #555;
                position: relative;
                flex-direction: column;
                transition-duration: 0.2s;
                overflow: hidden;
                font-family: monospace;
                font-weight: bold;
                font-size: 20px;
                margin: 5px;
                text-align: center;
                padding: 10px;
            }

            #box:hover, #box[drag] {
                border-color: #38f;
                color: #ddd
            }

            #input {
                cursor: pointer;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
            }

            #display {
                width: 100%;
                height: 100%
            }

            select, button {
                padding: 0.6em 0.4em;
                margin: 0.5em;
                width: 15em;
                max-width: 100%;
                font-family: monospace;
                font-weight: bold;
                font-size: 16px;
                background-color: #444;
                color: #aaa;
                border-radius: 0.4em;
                border: 1px solid #555;
                cursor: pointer;
                transition-duration: 0.2s
            }

            select:hover, button:hover {
                background-color: #666;
                color: #ddd
            }

            .logo {
                width: 130px;
                height: 130px;
                filter: drop-shadow(0 0 10px white);
            }

            #top {
                margin: 5px;
            }

            .game-list-container {
                width: 100%;
                max-height: 55vh;
                overflow-y: auto;
                padding: 10px;
            }

            .game-category {
                margin-bottom: 20px;
            }

            .game-category-title {
                font-size: 18px;
                color: #38f;
                margin: 15px 0 10px 0;
                border-bottom: 1px solid #444;
                padding-bottom: 5px;
            }

            .game-subcategory-title {
                font-size: 16px;
                color: #aaa;
                margin: 10px 0 8px 20px;
            }

            .game-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-left: 20px;
            }

            .game-button {
                width: auto !important;
                min-width: 120px;
            }
        </style>
    </head>

    <body>
        <div id="top">
            <img src="docs/Logo-light.png" alt="Logo" class="logo">
            <br>
            <div id="game-list" class="game-list-container">
                <p>正在加载游戏列表...</p>
            </div>
            <br>
        </div>
        <div id="box">
            <input type = file id = input>
            Drag ROM file or click here
        </div>

        <script>
            let enableDebug = true;
            let enableThreads = false;
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            if (parseInt(urlParams.get('debug')) === 1 || urlParams.get('debug') === "true") {
                enableDebug = true;
                console.log("Debug is enabled");
            } else {
                console.log("Debug is disabled");
            }

            if (parseInt(urlParams.get('threads')) === 1 || urlParams.get('threads') === "true") {
                if (window.SharedArrayBuffer) {
                    enableThreads = true;
                    console.log("Threads are enabled");
                } else {
                    console.warn("Threads are disabled as SharedArrayBuffer is not available. Threads requires two headers to be set when sending you html page. See https://stackoverflow.com/a/68630724");
                    console.log("Threads are disabled");
                }
            } else {
                console.log("Threads are disabled");
            }

            if (urlParams.get('rom')) {
                console.log(`Loading ROM from URL: ${urlParams.get('rom')}`);
                run(false, urlParams.get('rom'));
            } else {
                loadGameList();
            }

            async function loadGameList() {
                try {
                    const response = await fetch('game-list.json');
                    const games = await response.json();
                    displayGameList(games);
                } catch (error) {
                    console.error('加载游戏列表失败:', error);
                    document.getElementById('game-list').innerHTML = 
                        '<p style="color: red;">加载游戏列表失败，请检查 game-list.json 文件是否存在。</p>';
                }
            }

            function displayGameList(games) {
                const container = document.getElementById('game-list');
                container.innerHTML = '';
                
                // 按分类和子分类分组
                const grouped = {};
                games.forEach(game => {
                    const category = game.category || '其他';
                    const subcategory = game.subcategory || '无分类';
                    
                    if (!grouped[category]) grouped[category] = {};
                    if (!grouped[category][subcategory]) grouped[category][subcategory] = [];
                    
                    grouped[category][subcategory].push(game);
                });
                
                // 渲染列表
                Object.keys(grouped).forEach(category => {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'game-category';
                    
                    const categoryTitle = document.createElement('div');
                    categoryTitle.className = 'game-category-title';
                    categoryTitle.textContent = getCategoryName(category);
                    categoryDiv.appendChild(categoryTitle);
                    
                    Object.keys(grouped[category]).forEach(subcategory => {
                        const subcategoryTitle = document.createElement('div');
                        subcategoryTitle.className = 'game-subcategory-title';
                        subcategoryTitle.textContent = subcategory;
                        categoryDiv.appendChild(subcategoryTitle);
                        
                        const gridDiv = document.createElement('div');
                        gridDiv.className = 'game-grid';
                        
                        grouped[category][subcategory].forEach(game => {
                            const button = document.createElement('button');
                            button.className = 'game-button';
                            button.textContent = game.name;
                            button.onclick = () => startGame(game.path);
                            gridDiv.appendChild(button);
                        });
                        
                        categoryDiv.appendChild(gridDiv);
                    });
                    
                    container.appendChild(categoryDiv);
                });
            }

            function getCategoryName(category) {
                const names = {
                    'nes': '任天堂娱乐系统 (NES)',
                    'snes': '超级任天堂 (SNES)',
                    'gb': 'Game Boy',
                    'gba': 'Game Boy Advance',
                    'n64': 'Nintendo 64',
                    'md': '世嘉 Genesis / Mega Drive (MD)'
                };
                return names[category] || category;
            }

            function startGame(gamePath) {
                window.open(`index.html?rom=${encodeURIComponent(gamePath)}`, '_blank');
            }

            async function run(upload, file) {
                const url = upload ? input.files[0] : file;
                const filename = upload ? input.files[0].name : file.split('/').pop();
                const parts = filename.split(".");

                const core = await (async (ext) => {
                    if (["fds", "nes", "unif", "unf"].includes(ext))
                        return "nes"

                    if (["smc", "fig", "sfc", "gd3", "gd7", "dx2", "bsx", "swc"].includes(ext))
                        return "snes"

                    if (["z64", "n64"].includes(ext))
                        return "n64"

                    if (["md", "smd"].includes(ext))
                        return "segaMD"

                    if (["pce"].includes(ext))
                        return "pce"

                    if (["ngp", "ngc"].includes(ext))
                        return "ngp"

                    if (["ws", "wsc"].includes(ext))
                        return "ws"

                    if (["col", "cv"].includes(ext))
                        return "coleco"

                    if (["d64"].includes(ext))
                        return "vice_x64sc"

                    if (["nds", "gba", "gb", "z64", "n64"].includes(ext))
                        return ext

                    return await new Promise(resolve => {
                        var coreValues = {
                            "Nintendo 64": "n64",
                            "Nintendo Game Boy": "gb",
                            "Nintendo Game Boy Advance": "gba",
                            "Nintendo DS": "nds",
                            "Nintendo Entertainment System": "nes",
                            "Super Nintendo Entertainment System": "snes",
                            "PlayStation": "psx",
                            "Virtual Boy": "vb",
                            "Sega Mega Drive": "segaMD",
                            "Sega Master System": "segaMS",
                            "Sega CD": "segaCD",
                            "Atari Lynx": "lynx",
                            "Sega 32X": "sega32x",
                            "Atari Jaguar": "jaguar",
                            "Sega Game Gear": "segaGG",
                            "Sega Saturn": "segaSaturn",
                            "Atari 7800": "atari7800",
                            "Atari 2600": "atari2600",
                            "Arcade": "arcade",
                            "NEC TurboGrafx-16/SuperGrafx/PC Engine": "pce",
                            "NEC PC-FX": "pcfx",
                            "SNK NeoGeo Pocket (Color)": "ngp",
                            "Bandai WonderSwan (Color)": "ws",
                            "ColecoVision": "coleco",
                            "Commodore 64": "vice_x64sc",
                            "Commodore 128": "vice_x128",
                            "Commodore VIC20": "vice_xvic",
                            "Commodore Plus/4": "vice_xplus4",
                            "Commodore PET": "vice_xpet"
                        }

                        const cores = Object.keys(coreValues).sort().reduce(
                            (obj, key) => { 
                                obj[key] = coreValues[key]; 
                                return obj;
                            }, 
                            {}
                        );

                        const button = document.createElement("button")
                        const select = document.createElement("select")

                        for (const type in cores) {
                            const option = document.createElement("option")

                            option.value = cores[type]
                            option.textContent = type
                            select.appendChild(option)
                        }

                        button.onclick = () => resolve(select[select.selectedIndex].value)
                        button.textContent = "Load game"
                        box.innerHTML = ""

                        box.appendChild(select)
                        box.appendChild(button)
                    })
                })(parts.pop())

                const div = document.createElement("div")
                const sub = document.createElement("div")
                const script = document.createElement("script")

                sub.id = "game"
                div.id = "display"

                const top = document.getElementById("top");
                top.remove();
                box.remove()
                div.appendChild(sub)
                document.body.appendChild(div)

                window.EJS_player = "#game";
                window.EJS_gameName = parts.shift();
                window.EJS_biosUrl = "";
                window.EJS_gameUrl = url;
                window.EJS_core = core;
                window.EJS_pathtodata = "data/";
                window.EJS_startOnLoaded = true;
                window.EJS_DEBUG_XX = enableDebug;
                window.EJS_disableDatabases = true;
                window.EJS_threads = enableThreads;

                script.src = "data/loader.js";
                document.body.appendChild(script);
            }
            
            input.onchange = async () => {
                run(true);
            }
            
            box.ondragover = () => box.setAttribute("drag", true);
            box.ondragleave = () => box.removeAttribute("drag");
        </script>
    </body>
</html>
