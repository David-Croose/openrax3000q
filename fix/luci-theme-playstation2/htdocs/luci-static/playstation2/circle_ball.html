<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>正弦变速小球 + 拖影辉光</title>
    <style>
        * {margin:0;padding:0;}
        body {overflow:hidden;background:#000;}
        canvas {display:block;}
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

camera.position.set(0, 14, 22);
camera.lookAt(0, 0, 0);

const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

const orbitRadius = 6;
const ballCount = 8;
const ballRadius = 0.35;
const tiltSpeed = 0.03;
const trailLength = 15;

const colors = [0xff3333, 0x33ff33, 0x3333ff, 0xffff33, 0xff33ff, 0x33ffff, 0xff9933, 0xffffff];

function createGlowTexture(r, g, b) {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const center = size / 2;

    const grad = ctx.createRadialGradient(center, center, 0, center, center, center);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.15, `rgba(${r}, ${g}, ${b}, 0.9)`);
    grad.addColorStop(0.4, `rgba(${r}, ${g}, ${b}, 0.4)`);
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);

    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

function colorToRGB(hex) {
    return {
        r: (hex >> 16) & 0xff,
        g: (hex >> 8) & 0xff,
        b: hex & 0xff
    };
}

const balls = [];

for (let i = 0; i < ballCount; i++) {
    const rgb = colorToRGB(colors[i]);
    const texture = createGlowTexture(rgb.r, rgb.g, rgb.b);

    const spriteMat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.scale.set(1.2, 1.2, 1);

    const randomAngle = Math.random() * Math.PI * 2;

    const trail = [];
    for (let t = 0; t < trailLength; t++) {
        const trailSpriteMat = new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.4 * (1 - t / trailLength)
        });
        const trailSprite = new THREE.Sprite(trailSpriteMat);
        trailSprite.scale.set(1.2 * (1 - t / trailLength * 0.7), 1.2 * (1 - t / trailLength * 0.7), 1);
        trailSprite.visible = false;
        orbitGroup.add(trailSprite);
        trail.push({ sprite: trailSprite, mat: trailSpriteMat });
    }

    orbitGroup.add(sprite);

    balls.push({
        mesh: sprite,
        angle: randomAngle,
        baseSpeed: 4 + Math.random() * 0.25,
        sinOffset: Math.random() * 10,
        sinScale: 0.3 + Math.random() * 0.2,
        trail: trail,
        posHistory: []
    });
}

let time = 0;

function animate() {
    requestAnimationFrame(animate);
    time += 0.05;

    balls.forEach((item) => {
        const dynamicSpeed = item.baseSpeed + Math.sin(time + item.sinOffset) * item.sinScale;
        item.angle += dynamicSpeed * 0.01;

        const x = Math.cos(item.angle) * orbitRadius;
        const z = Math.sin(item.angle) * orbitRadius;
        item.mesh.position.set(x, 0, z);

        item.posHistory.unshift({ x, z });
        if (item.posHistory.length > trailLength) {
            item.posHistory.pop();
        }

        for (let t = 0; t < item.trail.length; t++) {
            if (t < item.posHistory.length) {
                const pos = item.posHistory[t];
                item.trail[t].sprite.position.set(pos.x, 0, pos.z);
                item.trail[t].sprite.visible = true;
            } else {
                item.trail[t].sprite.visible = false;
            }
        }
    });

    orbitGroup.rotation.x += tiltSpeed;

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
